<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
  <title id="title">Eslam's development terminal</title>
  <desc id="desc">A looping terminal animation showing API development, testing, Docker deployment, and a suspicious log. Status: shipping useful things.</desc>
  <style>
    .line { animation: reveal 12s infinite; }
    .two { animation-delay: 1s; } .three { animation-delay: 2s; } .four { animation-delay: 3s; }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes reveal { 0%, 5% { opacity: 0; } 12%, 90% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .line, .cursor { animation: none; opacity: 1; } }
  </style>
  <rect x="1" y="1" width="898" height="278" rx="16" fill="#0d1117" stroke="#30363d"/>
  <path d="M17 1h866a16 16 0 0 1 16 16v29H1V17A16 16 0 0 1 17 1Z" fill="#161b22"/>
  <circle cx="25" cy="24" r="6" fill="#ff5f57"/><circle cx="47" cy="24" r="6" fill="#febc2e"/><circle cx="69" cy="24" r="6" fill="#28c840"/>
  <text x="450" y="29" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="13">eslam@github: ~/ideas-that-became-projects</text>
  <g font-family="monospace" font-size="17">
    <text x="28" y="84" fill="#58a6ff">$ ./another-perfectly-reasonable-project</text>
    <text class="line" x="28" y="120" fill="#c9d1d9">[build] APIs ready. Business logic has entered the chat.</text>
    <text class="line two" x="28" y="154" fill="#3fb950">[test]  Assumptions challenged. Feelings mildly injured.</text>
    <text class="line three" x="28" y="188" fill="#bc8cff">[ship]  Packed it in Docker. Yes, the whole machine.</text>
    <text class="line four" x="28" y="222" fill="#e3b341">[logs]  One suspicious line. A sequel is possible.</text>
    <text x="28" y="258" fill="#58a6ff">$ <tspan class="cursor">▌</tspan></text>
    <text x="872" y="258" text-anchor="end" fill="#8b949e" font-size="12">STATUS: SHIPPING USEFUL THINGS</text>
  </g>
</svg>
